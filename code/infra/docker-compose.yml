services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: silo
      POSTGRES_PASSWORD: silo
      POSTGRES_DB: silo
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
