<text x="140" y="252" text-anchor="middle" font-size="15" fill="#1a1a1a">.py or .zip</text>
<rect x="300.0" y="296" width="240" height="56" rx="10" ry="10" fill="#fff6b8" stroke="#8a7712" stroke-width="1.8"/>
<text x="420" y="321" text-anchor="middle" font-size="15" fill="#1a1a1a">Store bundle,</text>
<text x="420" y="340" text-anchor="middle" font-size="15" fill="#1a1a1a">version = analysing</text>
<rect x="600.0" y="384" width="280" height="56" rx="10" ry="10" fill="#fff6b8" stroke="#8a7712" stroke-width="1.8"/>
